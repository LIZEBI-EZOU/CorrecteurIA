name: Android Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.4.1" }
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$HOME/.android/correcteuria-release.jks"
      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease             -PRELEASE_STORE_FILE="$HOME/.android/correcteuria-release.jks"             -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"             -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"             -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: CorrecteurIA-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
