name: CorrecteurIA Server Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        env:
          SERVER_URL: https://correcteuria-api.onrender.com
        run: |
          set -euo pipefail
          echo "Checking $SERVER_URL/health"
          curl --fail --silent --show-error --max-time 15 "$SERVER_URL/health"
          echo
          echo "Checking $SERVER_URL/ready"
          curl --fail --silent --show-error --max-time 15 "$SERVER_URL/ready"
          echo
