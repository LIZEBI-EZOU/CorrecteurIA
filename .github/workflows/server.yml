name: CorrecteurIA Server CI

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
                - name: Install
        run: npm install
      - name: Tests
        run: npm test
      - name: Docker build
        run: docker build -t correcteuria-server:test .
